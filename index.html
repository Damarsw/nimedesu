<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeDesu - Nonton Anime Sub Indo</title>
    <meta name="description" content="Platform streaming dan web anime Nimedesu.">
    <meta name="robots" content="index, follow">
    <link rel="icon" href="https://i.ibb.co.com/Ld2r8ZLS/logo.png" type="image/png" />

    <!-- Turnstile SDK dengan callback load -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback" async defer></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#F8F9FA',        
                            lightCard: '#FFFFFF',      
                            lightBorder: '#F6BE00',    
                            darkBg: '#0f0e0a',         
                            darkCard: '#1a1912',       
                            darkBorder: '#33311f',     
                            yellow: '#F6BE00',         
                            yellowHover: '#d4a000'     
                        }
                    },
                    boxShadow: {
                        'glow-yellow': '0 0 15px rgba(246, 190, 0, 0.4), inset 0 0 5px rgba(246, 190, 0, 0.2)'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style> 
        body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; } 

        .poster-hover-container .play-overlay {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .poster-hover-container:hover .play-overlay {
            opacity: 1;
        }
        .poster-hover-container:hover img {
            transform: scale(1.08);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }

        @keyframes rotateBeam {
            to { --angle: 360deg; }
        }

        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 12px rgba(217, 155, 0, 0.4), inset 0 0 4px rgba(217, 155, 0, 0.2); }
            50% { box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), inset 0 0 8px rgba(255, 215, 0, 0.4); }
        }

        @keyframes pulseSilver {
            0%, 100% { box-shadow: 0 0 10px rgba(161, 161, 170, 0.3), inset 0 0 3px rgba(161, 161, 170, 0.15); }
            50% { box-shadow: 0 0 22px rgba(228, 228, 231, 0.85), inset 0 0 6px rgba(228, 228, 231, 0.35); }
        }

        @keyframes pulseBronze {
            0%, 100% { box-shadow: 0 0 10px rgba(180, 83, 9, 0.3), inset 0 0 3px rgba(180, 83, 9, 0.15); }
            50% { box-shadow: 0 0 22px rgba(245, 158, 11, 0.85), inset 0 0 6px rgba(245, 158, 11, 0.35); }
        }

        .podium-card-neon { position: relative; z-index: 0; }
        .podium-neon-border { position: absolute; inset: 0; border-radius: 1rem; overflow: hidden; z-index: -1; }
        .podium-neon-border::before { content: ''; position: absolute; inset: -60%; z-index: -2; }
        .podium-neon-border::after { content: ''; position: absolute; inset: 2px; border-radius: 0.9rem; z-index: -1; background: inherit; }

        .podium-gold-glow { animation: pulseGold 2s infinite ease-in-out; }
        .podium-gold-glow .podium-neon-border::before {
            background: conic-gradient(from var(--angle), transparent 35%, #d99b00 45%, #ffe066 48%, #ffffff 50%, transparent 85%, #d99b00 95%, #ffe066 98%, #ffffff 100%);
            animation: rotateBeam 2.5s linear infinite;
        }

        .podium-silver-glow { animation: pulseSilver 2.6s infinite ease-in-out 0.6s; }
        .podium-silver-glow .podium-neon-border::before {
            background: conic-gradient(from var(--angle), transparent 35%, #71717a 45%, #e4e4e7 48%, #ffffff 50%, transparent 85%, #71717a 95%, #e4e4e7 98%, #ffffff 100%);
            animation: rotateBeam 3.1s linear infinite 0.6s;
        }

        .podium-bronze-glow { animation: pulseBronze 3.2s infinite ease-in-out 1.2s; }
        .podium-bronze-glow .podium-neon-border::before {
            background: conic-gradient(from var(--angle), transparent 35%, #b45309 45%, #f59e0b 48%, #ffffff 50%, transparent 85%, #b45309 95%, #f59e0b 98%, #ffffff 100%);
            animation: rotateBeam 3.7s linear infinite 1.2s;
        }
    
        input#searchField {
            background-color: transparent !important;
            color: #000000 !important;
        }
        .dark input#searchField {
            color: #ffffff !important;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #000000 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover, 
        .dark input:-webkit-autofill:focus, 
        .dark input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-neon-lightBg text-black dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <!-- OVERLAY TURNSTILE DI SINI (TEPAT DI DALAM BODY) -->
    <div id="turnstileOverlay" class="fixed inset-0 z-[9999] bg-[#0f0e0a] flex flex-col items-center justify-center space-y-4 p-4 transition-opacity duration-500">
        <div class="text-center space-y-2 mb-2">
            <h2 class="text-xl font-bold text-[#F6BE00]">Verifikasi Keamanan</h2>
            <p class="text-xs text-zinc-400">Harap selesaikan verifikasi Cloudflare sebelum mengakses NimeDesu.</p>
        </div>
        <!-- Kontainer khusus untuk dikontrol oleh JavaScript render -->
        <div id="turnstileContainer"></div>
    </div>

    <!-- FIXED HEADER -->
    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#F6BE00]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-yellow/50 dark:border-neon-darkBorder shadow-sm dark:shadow-[0_4px_20px_rgba(217,155,0,0.15)] transition-transform duration-300">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <button onclick="toggleSidebar()" class="p-2.5 rounded-full bg-transparent hover:bg-black/10 dark:hover:bg-yellow-500/25 transition text-black dark:text-neon-yellow" title="Menu">
                    <i class="fa-solid fa-bars text-base"></i>
                </button>
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="switchView('home')">
                    <span class="text-xl sm:text-2xl font-bold tracking-tight text-black dark:text-neon-yellow">NimeDesu</span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <span class="text-xs text-zinc-600 dark:text-zinc-300">Selamat Datang di Indeks Peringkat NimeDesu</span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btnSearchToggle" onclick="toggleSearchInput(event)" class="p-2.5 rounded-full bg-transparent hover:bg-black/10 dark:hover:bg-yellow-500/25 transition text-black dark:text-neon-yellow" title="Cari Anime">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>

                <div id="headerAuthContainer">
                    <button onclick="loginAniList()" class="p-2.5 rounded-full bg-transparent hover:bg-black/10 dark:hover:bg-yellow-500/25 transition text-black dark:text-neon-yellow" title="Login AniList">
                        <i class="fa-solid fa-user text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="searchContainer" class="hidden w-full bg-white/95 dark:bg-[#1a1912]/95 border-b-2 border-neon-yellow shadow-xl py-3 px-4 sm:px-8 transition-all duration-300 relative z-50">
            <div id="searchBoxWrapper" class="relative max-w-2xl mx-auto flex flex-col">
                <div class="flex items-center bg-zinc-100 dark:bg-zinc-900 rounded-2xl border border-neon-yellow/60 overflow-hidden px-2 py-1 shadow-inner">
                    <input type="text" id="searchField" placeholder="Ketik nama anime disini..." oninput="liveSearchAnime()" onkeypress="if(event.key === 'Enter') searchAnime()" class="w-full bg-transparent text-sm sm:text-base pl-4 pr-3 py-2.5 focus:outline-none placeholder:text-zinc-400 font-medium text-black dark:text-white">
                    <button onclick="searchAnime()" class="bg-neon-yellow hover:bg-yellow-600 px-5 py-2.5 rounded-xl flex items-center justify-center text-black font-bold transition shrink-0">
                        <i class="fa-solid fa-magnifying-glass text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="toggleSearchInput(event)" class="p-2.5 text-zinc-400 hover:text-red-500 transition ml-1" title="Tutup">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
                <div id="searchSuggestions" class="hidden w-full bg-white dark:bg-[#1a1912] border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-72 overflow-y-auto mt-2 p-2 z-50"></div>
            </div>
        </div>
    </header>
    <script src="script-index.js"></script>
</body>
</html>
