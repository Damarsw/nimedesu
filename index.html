<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeDesu - Nonton Anime Sub Indo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#FFFAF0',        
                            lightCard: '#FFF78D',      
                            lightBorder: '#FFF78D',    
                            darkBg: '#0f0e0a',         
                            darkCard: '#1a1912',       
                            darkBorder: '#33311f',     
                            yellow: '#d99b00',         
                            yellowHover: '#b88200'     
                        }
                    },
                    boxShadow: {
                        'glow-yellow': '0 0 15px rgba(217, 155, 0, 0.4), inset 0 0 5px rgba(217, 155, 0, 0.2)'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; } 
        .poster-hover-container .play-overlay { opacity: 0; transition: opacity 0.6s ease-in-out; }
        .poster-hover-container:hover .play-overlay { opacity: 1; }
        .poster-hover-container:hover img { transform: scale(1.08); }
    </style>
</head>
<body class="bg-neon-lightBg text-zinc-900 dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#FFF78D]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-lightBorder dark:border-neon-darkBorder shadow-md transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button onclick="goBack()" class="p-2 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Kembali"><i class="fa-solid fa-arrow-left text-sm"></i></button>
                <button onclick="goHome()" class="p-2 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Beranda"><i class="fa-solid fa-house text-sm"></i></button>
                <span class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-neon-yellow cursor-pointer" onclick="goHome()">NimeDesu</span>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="toggleSearchInput()" class="p-2.5 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i class="fa-solid fa-magnifying-glass text-sm"></i></button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i id="themeIcon" class="fa-solid fa-moon text-sm"></i></button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full mt-16">
        <div id="searchContainer" class="hidden mb-8">
            <div class="relative max-w-xl mx-auto flex items-center bg-[#f0e66e] dark:bg-neon-darkCard rounded-full border-2 border-neon-yellow shadow-glow-yellow overflow-hidden">
                <input type="text" id="searchField" placeholder="Ketik nama anime disini" onkeypress="if(event.key === 'Enter') searchAnime()" class="w-full bg-transparent text-sm pl-6 pr-4 py-3.5 focus:outline-none font-medium text-zinc-900 dark:text-white">
                <button onclick="searchAnime()" class="bg-neon-yellow px-6 py-3.5 text-white dark:text-black transition"><i class="fa-solid fa-magnifying-glass text-sm"></i></button>
            </div>
        </div>

        <!-- Home View -->
        <div id="homeView">
            <div class="flex items-center gap-2 mb-6 relative flex-wrap">
                <button id="btnSemua" class="nav-tab-btn px-4 py-2 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard text-sm font-semibold border border-neon-lightBorder dark:border-neon-darkBorder transition text-zinc-900 dark:text-white" onclick="changeTab('all', this)">Semua</button>
                <button id="btnOngoing" class="nav-tab-btn px-4 py-2 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard text-sm font-semibold border border-neon-lightBorder dark:border-neon-darkBorder transition text-zinc-900 dark:text-white" onclick="changeTab('ongoing', this)">Ongoing</button>
                <button id="btnCompleted" class="nav-tab-btn px-4 py-2 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard text-sm font-semibold border border-neon-lightBorder dark:border-neon-darkBorder transition text-zinc-900 dark:text-white" onclick="changeTab('completed', this)">Completed</button>
                
                <div class="relative inline-block">
                    <button id="btnGenre" class="nav-tab-btn px-4 py-2 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard text-sm font-semibold border border-neon-lightBorder dark:border-neon-darkBorder transition text-zinc-900 dark:text-white" onclick="toggleDropdown(event)">Genre ▾</button>
                    <div class="hidden absolute left-0 top-12 bg-[#FFF78D] dark:bg-[#14130e] w-44 max-h-[250px] overflow-y-auto shadow-2xl rounded-xl p-1.5 z-50 flex flex-col gap-1 border border-neon-lightBorder dark:border-neon-darkBorder" id="genreDropdown">
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Action')">Action</button>
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Adventure')">Adventure</button>
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Comedy')">Comedy</button>
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Ecchi')">Ecchi</button>
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Fantasy')">Fantasy</button>
                        <button class="text-left text-xs font-semibold p-1.5 rounded hover:bg-neon-yellow hover:text-white" onclick="filterGenre('Romance')">Romance</button>
                    </div>
                </div>
            </div>

            <div class="mb-6 pb-2"><h2 id="sectionHeader" class="text-xl sm:text-2xl font-bold border-l-4 border-neon-yellow pl-3">Semua Daftar Anime</h2></div>
            <div id="animeDisplayGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-5"></div>
            <div id="paginationBox" class="flex justify-center items-center space-x-2 mt-8 flex-wrap"></div>
        </div>

        <!-- Detail View -->
        <div id="detailView" class="hidden">
            <div class="flex flex-col sm:flex-row gap-5 items-center sm:items-start mb-8 bg-neon-lightCard dark:bg-neon-darkCard p-5 rounded-2xl border border-neon-lightBorder dark:border-neon-darkBorder">
                <div class="w-32 sm:w-36 aspect-[3/4] rounded-xl overflow-hidden border bg-zinc-200 dark:bg-zinc-800 shrink-0">
                    <img id="detThumbnail" src="" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col justify-center w-full space-y-3 text-center sm:text-left">
                    <div>
                        <span id="detStatusBadge" class="bg-neon-yellow text-white dark:text-black text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">Ongoing</span>
                        <h1 id="detTitle" class="text-xl sm:text-2xl font-bold mt-1.5">Judul Anime</h1>
                        <div id="detGenreLinks" class="flex flex-wrap gap-1.5 mt-2 justify-center sm:justify-start"></div>
                    </div>
                    <div class="flex flex-wrap gap-2 justify-center sm:justify-start">
                        <span class="py-2 px-4 rounded-xl text-xs font-bold bg-neon-yellow text-white flex items-center gap-2"><i class="fa-solid fa-circle-info"></i> Detail & Sinopsis</span>
                        <!-- TOMBOL MEMBUKA STREAMING DI TAB BARU -->
                        <button id="btnOpenStream" class="py-2 px-4 rounded-xl text-xs font-bold bg-neon-lightBg dark:bg-neon-darkBg border hover:border-neon-yellow transition flex items-center gap-2">
                            <i class="fa-solid fa-play"></i> Streaming <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full space-y-6">
                <div class="bg-neon-lightCard dark:bg-neon-darkCard p-6 rounded-xl border">
                    <h3 class="text-sm font-bold text-neon-yellow uppercase mb-2">Sinopsis</h3>
                    <p id="synopsisText" class="text-xs sm:text-sm leading-relaxed">-</p>
                </div>
            </div>
        </div>
    </main>

    <footer class="border-t py-6 mt-12 text-center text-xs text-zinc-700 dark:text-zinc-400"><p>NimeDesu - Nonton Anime Sub Indonesia</p></footer>

    <script>
        let currentData = [];
        let filteredData = [];
        let currentPage = 1;
        let activeAnime = null;
        const itemsPerPage = 12;
        const RENDER_API_URL = "https://nimedesu.onrender.com";

        async function loadAnimeDatabase() {
            try {
                const [infoRes, synRes] = await Promise.all([
                    fetch(`${RENDER_API_URL}/api/anime`),
                    fetch(`${RENDER_API_URL}/api/sinopsis`).catch(() => ({ json: () => [] }))
                ]);
                const infoData = await infoRes.json();
                const synData = await synRes.json();
                const synMap = {};
                synData.forEach(i => { if(i.url) synMap[i.url.trim()] = i.sinopsis; });

                currentData = infoData.map((item, index) => ({
                    id: index + 1,
                    title: item.title || item.Judul || "Tanpa Judul",
                    url: item.url ? item.url.trim() : "",
                    status: item.Status || "Ongoing",
                    genres: item.Genre ? item.Genre.split(',').map(g => g.trim()) : [],
                    synopsis: synMap[item.url?.trim()] || item.sinopsis || "Tidak ada sinopsis.",
                    thumbnail: item.image_url || item.thumbnail || "https://placehold.co/400x600?text=No+Image",
                    japanese: item.Japanese || "-",
                    skor: item.Skor || "-"
                }));
                filteredData = [...currentData];
                displayAnimeWithPagination();
            } catch (e) { console.error(e); }
        }

        function displayAnimeWithPagination() {
            const grid = document.getElementById('animeDisplayGrid');
            const box = document.getElementById('paginationBox');
            if(!filteredData.length) { grid.innerHTML = '<p class="col-span-full text-center py-10">Tidak ada anime.</p>'; box.innerHTML = ''; return; }

            const totalPages = Math.ceil(filteredData.length / itemsPerPage);
            if (currentPage > totalPages) currentPage = totalPages;
            const items = filteredData.slice((currentPage - 1) * itemsPerPage, currentPage * itemsPerPage);

            grid.innerHTML = items.map(item => `
                <div class="group bg-neon-lightCard dark:bg-neon-darkCard rounded-xl overflow-hidden border hover:border-neon-yellow cursor-pointer shadow-sm flex flex-col" onclick="viewDetails('${item.id}')">
                    <div class="relative aspect-[3/4] overflow-hidden bg-zinc-800 poster-hover-container">
                        <img src="${item.thumbnail}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300">
                        <div class="play-overlay absolute inset-0 bg-black/30 flex items-center justify-center">
                            <div class="w-12 h-12 rounded-full bg-neon-yellow text-black flex items-center justify-center shadow-lg"><i class="fa-solid fa-circle-info"></i></div>
                        </div>
                        <span class="absolute top-2 left-2 bg-black/75 text-white text-[10px] px-2 py-0.5 rounded-full">${item.status}</span>
                    </div>
                    <div class="p-3"><h4 class="font-semibold text-xs sm:text-sm line-clamp-2">${item.title}</h4></div>
                </div>
            `).join('');

            box.innerHTML = `<button class="px-3 py-1.5 border rounded" onclick="goToPage(${currentPage-1})" ${currentPage===1?'disabled':''}>&lsaquo;</button> <span class="text-xs px-2">Hal ${currentPage} dari ${totalPages}</span> <button class="px-3 py-1.5 border rounded" onclick="goToPage(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>&rsaquo;</button>`;
        }

        function goToPage(p) { currentPage = p; displayAnimeWithPagination(); window.scrollTo({top:0, behavior:'smooth'}); }
        
        function viewDetails(id) {
            activeAnime = currentData.find(a => a.id == id);
            if(!activeAnime) return;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('detTitle').innerText = activeAnime.title;
            document.getElementById('detThumbnail').src = activeAnime.thumbnail;
            document.getElementById('detStatusBadge').innerText = activeAnime.status;
            document.getElementById('synopsisText').innerText = activeAnime.synopsis;
            
            // Atur agar tombol streaming membuka file stream.html dengan membawa parameter URL encode anime
            document.getElementById('btnOpenStream').onclick = () => {
                window.open(`stream.html?url=${encodeURIComponent(activeAnime.url)}`, '_blank');
            };
            window.scrollTo({top:0, behavior:'smooth'});
        }

        function goHome() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }
        function goBack() { goHome(); }
        
        function toggleDropdown(e) { e.stopPropagation(); document.getElementById('genreDropdown').classList.toggle('hidden'); }
        function filterGenre(g) {
            goHome(); document.getElementById('genreDropdown').classList.add('hidden');
            filteredData = currentData.filter(a => a.genres.some(genre => genre.toLowerCase() === g.toLowerCase()));
            document.getElementById('sectionHeader').innerText = `Genre: ${g}`;
            displayAnimeWithPagination();
        }
        function changeTab(t, el) {
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('bg-neon-yellow', 'text-white'));
            if(el) el.classList.add('bg-neon-yellow', 'text-white');
            currentPage = 1;
            if(t === 'ongoing') { filteredData = currentData.filter(a => a.status.toLowerCase().includes('ongoing')); }
            else if(t === 'completed') { filteredData = currentData.filter(a => a.status.toLowerCase().includes('completed')); }
            else { filteredData = [...currentData]; }
            displayAnimeWithPagination();
        }
        window.onload = () => { loadAnimeDatabase(); };
    </script>
</body>
</html>
