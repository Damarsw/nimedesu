<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimeDesu - Nonton Anime Sub Indo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#f6f0d8', lightCard: '#e6dfbc', lightBorder: '#c2b88d',
                            darkBg: '#0f0e0a', darkCard: '#1a1912', darkBorder: '#33311f',
                            yellow: '#d99b00', yellowHover: '#b88200'
                        }
                    },
                    boxShadow: { 'glow-yellow': '0 0 15px rgba(217, 155, 0, 0.4), inset 0 0 5px rgba(217, 155, 0, 0.2)' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; } 
        .poster-hover-container .play-overlay { opacity: 0; transition: opacity 0.6s ease-in-out; }
        .poster-hover-container:hover .play-overlay { opacity: 1; }
        .poster-hover-container:hover img { transform: scale(1.08); }
    </style>
</head>
<body class="bg-neon-lightBg text-zinc-900 dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#f6f0d8]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-lightBorder dark:border-neon-darkBorder shadow-md transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2">
                <button onclick="goBack()" class="p-2 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i class="fa-solid fa-arrow-left text-sm"></i></button>
                <button onclick="goHome()" class="p-2 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i class="fa-solid fa-house text-sm"></i></button>
                <span class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-neon-yellow cursor-pointer ml-1" onclick="goHome()">NimeDesu</span>
            </div>
            <div class="flex items-center space-x-2">
                <button id="btnSearchToggle" onclick="toggleSearchInput()" class="p-2.5 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i class="fa-solid fa-magnifying-glass text-sm"></i></button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow"><i id="themeIcon" class="fa-solid fa-moon text-sm"></i></button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full mt-16">
        <div id="searchContainer" class="hidden mb-8">
            <div class="relative max-w-xl mx-auto flex items-center bg-[#ede6c2] dark:bg-neon-darkCard rounded-full border-2 border-neon-yellow shadow-glow-yellow overflow-hidden">
                <input type="text" id="searchField" placeholder="Ketik nama anime disini" onkeypress="if(event.key === 'Enter') searchAnime()" class="w-full bg-transparent text-sm pl-6 pr-4 py-3.5 focus:outline-none text-zinc-900 dark:text-white">
                <button onclick="searchAnime()" class="bg-neon-yellow hover:bg-yellow-600 px-6 py-3.5 text-white dark:text-black transition"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
        </div>

        <div id="homeView">
            <div class="mb-6 pb-2">
                <h2 id="sectionHeader" class="text-xl sm:text-2xl font-bold tracking-tight border-l-4 border-neon-yellow pl-3">Semua Daftar Anime</h2>
            </div>
            <div id="animeDisplayGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 sm:gap-5"></div>
            <div id="paginationBox" class="flex justify-center items-center space-x-2 mt-8 flex-wrap gap-y-2"></div>
        </div>

        <div id="detailView" class="hidden">
            <div class="flex flex-col sm:flex-row gap-5 items-center mb-8 bg-neon-lightCard dark:bg-neon-darkCard p-5 rounded-2xl border border-neon-lightBorder dark:border-neon-darkBorder">
                <div class="w-32 sm:w-36 aspect-[3/4] rounded-xl overflow-hidden bg-zinc-800 shrink-0">
                    <img id="detThumbnail" src="" alt="" loading="lazy" class="w-full h-full object-cover">
                </div>
                <div class="flex flex-col justify-center w-full space-y-3 text-center sm:text-left">
                    <div>
                        <span id="detStatusBadge" class="bg-neon-yellow text-black text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase">Ongoing</span>
                        <h1 id="detTitle" class="text-xl sm:text-2xl font-bold mt-1.5">Judul Anime</h1>
                    </div>
                    <button onclick="openStreamingPage()" class="py-2 px-4 rounded-xl text-xs font-bold bg-neon-yellow text-white shadow-glow-yellow w-fit mx-auto sm:mx-0 flex items-center gap-2"><i class="fa-solid fa-play"></i> Streaming</button>
                </div>
            </div>
            <div class="bg-neon-lightCard dark:bg-neon-darkCard p-6 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder">
                <h3 class="text-sm font-bold text-neon-yellow uppercase mb-2">Sinopsis</h3>
                <p id="synopsisText" class="text-xs sm:text-sm leading-relaxed">-</p>
            </div>
        </div>

        <div id="streamingView" class="hidden space-y-6">
            <h1 id="streamTitle" class="text-xl font-bold border-l-4 border-neon-yellow pl-3">Nonton Streaming</h1>
            <div class="bg-black rounded-xl overflow-hidden aspect-video relative flex items-center justify-center">
                <iframe id="videoIframe" src="" class="w-full h-full border-0" allowfullscreen></iframe>
            </div>
            <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder space-y-3">
                <span class="text-xs font-semibold">Server: <span id="currentServerLabel" class="font-bold">-</span></span>
                <div id="mainServerContainer" class="space-y-2"></div>
            </div>
            <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder">
                <span class="text-xs font-semibold">Daftar Episode</span>
                <div id="episodeBoxContainer" class="flex gap-2 flex-wrap pt-2"></div>
            </div>
        </div>
    </main>

    <script>
        let currentData = [], filteredData = [], currentPage = 1, activeAnime = null, activeEpisodeIndex = 0;
        const itemsPerPage = 12;

        async function fetchWithCache(url) {
            const cacheKey = 'nimedesu_cache_' + url;
            const cached = localStorage.getItem(cacheKey);
            if (cached) { try { return JSON.parse(cached); } catch(e) { localStorage.removeItem(cacheKey); } }
            const res = await fetch(url);
            if (!res.ok) throw new Error("Gagal fetch");
            const data = await res.json();
            try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch(e) {}
            return data;
        }

        async function loadAnimeDatabase() {
            const container = document.getElementById('animeDisplayGrid');
            container.innerHTML = `<p class="col-span-full text-center py-10 font-medium">Memuat data dari API Render...</p>`;
            try {
                // GANTI URL DI BAWAH INI DENGAN LINK WEB SERVICE RENDER ANDA
                const RENDER_API_URL = "https://nama-bot-anda.onrender.com";

                const [infoData, synopsisData, superData] = await Promise.all([
                    fetchWithCache(`${RENDER_API_URL}/api/anime`),
                    fetchWithCache(`${RENDER_API_URL}/api/sinopsis`),
                    fetchWithCache(`${RENDER_API_URL}/api/super-lengkap`).catch(() => [])
                ]);

                const synopsisMap = {};
                synopsisData.forEach(item => { if (item.url) synopsisMap[item.url.trim()] = item.sinopsis || "-"; });

                const superMap = {};
                superData.forEach(item => {
                    const u = item.url || item.link;
                    if (u) superMap[u.trim()] = item.episodes || [];
                });

                currentData = infoData.map((item, index) => {
                    const u = item.url ? item.url.trim() : "";
                    return {
                        id: index + 1,
                        title: item.title || item.Judul || "Tanpa Judul",
                        url: u,
                        status: item.Status || "Ongoing",
                        genres: item.Genre ? item.Genre.split(',').map(g => g.trim()) : [],
                        synopsis: synopsisMap[u] || "Tidak ada sinopsis.",
                        thumbnail: item.image_url || "https://placehold.co/400x600?text=No+Image",
                        episodes: superMap[u] || item.episodes || []
                    };
                });

                filteredData = [...currentData];
                displayAnimeWithPagination();
            } catch (error) {
                container.innerHTML = `<div class="col-span-full text-center py-10"><p class="mb-2">Gagal memuat API server.</p><button onclick="loadAnimeDatabase()" class="px-4 py-2 bg-neon-yellow text-black font-bold rounded text-xs">Coba Lagi</button></div>`;
            }
        }

        function displayAnimeWithPagination() {
            const container = document.getElementById('animeDisplayGrid');
            if (filteredData.length === 0) { container.innerHTML = `<p class="col-span-full text-center">Kosong</p>`; return; }
            const start = (currentPage - 1) * itemsPerPage;
            container.innerHTML = filteredData.slice(start, start + itemsPerPage).map(item => `
                <div class="group bg-neon-lightCard dark:bg-neon-darkCard rounded-xl overflow-hidden border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow cursor-pointer flex flex-col" onclick="viewDetails('${item.id}')">
                    <div class="relative aspect-[3/4] overflow-hidden poster-hover-container bg-zinc-800">
                        <img src="${item.thumbnail}" loading="lazy" class="w-full h-full object-cover transition duration-300">
                        <span class="absolute top-2 left-2 bg-black/70 text-neon-yellow text-[10px] px-2 py-0.5 rounded-full">${item.status}</span>
                    </div>
                    <div class="p-3"><h4 class="font-semibold text-xs sm:text-sm line-clamp-2">${item.title}</h4></div>
                </div>
            `).join('');
        }

        function viewDetails(id) {
            activeAnime = currentData.find(a => a.id == id);
            if (!activeAnime) return;
            document.getElementById('homeView').classList.add('hidden');
            document.getElementById('detailView').classList.remove('hidden');
            document.getElementById('detTitle').innerText = activeAnime.title;
            document.getElementById('detThumbnail').src = activeAnime.thumbnail;
            document.getElementById('synopsisText').innerText = activeAnime.synopsis;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function openStreamingPage() {
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('streamingView').classList.remove('hidden');
            renderEpisodes();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderEpisodes() {
            const container = document.getElementById('episodeBoxContainer');
            if (!activeAnime.episodes.length) { container.innerHTML = "Tidak ada episode."; return; }
            container.innerHTML = activeAnime.episodes.map((ep, idx) => `
                <button onclick='selectEpisode(${idx})' class="px-3 py-1.5 rounded text-xs bg-neon-yellow text-white font-bold">${ep.episode_title || 'Eps ' + (idx+1)}</button>
            `).join('');
            selectEpisode(0);
        }

        function selectEpisode(idx) {
            activeEpisodeIndex = idx;
            const srvs = activeAnime.episodes[idx].video_servers || [];
            const container = document.getElementById('mainServerContainer');
            container.innerHTML = srvs.map(s => `
                <button onclick="document.getElementById('videoIframe').src='${s.video_url}'; document.getElementById('currentServerLabel').innerText='${s.resolution}'" class="w-full text-left px-3 py-1.5 rounded text-xs bg-neon-lightCard dark:bg-neon-darkCard hover:bg-neon-yellow transition">${s.resolution} (${s.server})</button>
            `).join('');
            if (srvs.length) {
                document.getElementById('videoIframe').src = srvs[0].video_url;
                document.getElementById('currentServerLabel').innerText = srvs[0].resolution;
            }
        }

        function goHome() {
            document.getElementById('streamingView').classList.add('hidden');
            document.getElementById('detailView').classList.add('hidden');
            document.getElementById('homeView').classList.remove('hidden');
        }
        function goBack() { goHome(); }
        function toggleTheme() { document.documentElement.classList.toggle('dark'); }
        window.onload = loadAnimeDatabase;
    </script>
</body>
</html>
