<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming - NimeDesu</title>
    <link rel="icon" href="https://i.ibb.co.com/Ld2r8ZLS/logo.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#FFFAF0',        
                            lightCard: '#FFF78D',      
                            lightBorder: '#FFF78D',    
                            darkBg: '#0f0e0a',         
                            darkCard: '#1a1912',       
                            darkBorder: '#33311f',     
                            yellow: '#d99b00',         
                            yellowHover: '#b88200'     
                        }
                    },
                    boxShadow: {
                        'glow-yellow': '0 0 15px rgba(217, 155, 0, 0.4), inset 0 0 5px rgba(217, 155, 0, 0.2)'
                    },
                    maxWidth: {
                        '8xl': '90rem'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style> 
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none; 
            user-select: none; 
        } 
        .poster-hover-container .play-overlay {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .poster-hover-container:hover .play-overlay {
            opacity: 1;
        }
        .poster-hover-container:hover img {
            transform: scale(1.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-neon-lightBg text-zinc-900 dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#FFF78D]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-lightBorder dark:border-neon-darkBorder shadow-md dark:shadow-[0_4px_20px_rgba(217,155,0,0.15)] transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2">
                <div class="flex items-center space-x-3 cursor-pointer group ml-1" onclick="window.location.href='index.html'">
                    <span class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-neon-yellow">NimeDesu</span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <p>Butuh bantuan atau kirim masukan? <a href="mailto:damdesu@proton.me" class="text-neon-yellow hover:underline font-medium">Hubungi saya</a></p>
            </div>

            <div class="flex items-center space-x-2">
                <div id="headerAuthContainer">
                    <button onclick="loginAniList()" class="px-3 py-1.5 rounded-full bg-zinc-900 text-white dark:bg-neon-yellow dark:text-black font-bold text-xs flex items-center gap-1.5 hover:opacity-90 transition">
                        <i class="fa-solid fa-user text-xs"></i> Login AniList
                    </button>
                </div>

                <button id="btnSearchToggle" onclick="toggleSearchInput(event)" class="p-2.5 rounded-full bg-transparent hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Cari Anime">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-transparent hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Ganti Tema">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full mt-16 space-y-6">

        <div id="searchContainer" class="hidden relative mb-8 transition-all duration-300 z-50">
            <div id="searchBoxWrapper" class="relative max-w-xl mx-auto flex items-center bg-white dark:bg-zinc-900 rounded-full border-2 border-neon-yellow shadow-glow-yellow overflow-hidden">
                <input type="text" id="searchField" placeholder="Ketik nama anime disini" oninput="liveSearchAnime()" onkeypress="if(event.key === 'Enter') executeSearch()" class="w-full bg-transparent text-sm pl-6 pr-4 py-3.5 focus:outline-none placeholder:text-zinc-500 font-medium text-zinc-900 dark:text-white">
                <button onclick="executeSearch()" class="bg-neon-yellow dark:bg-neon-yellow hover:bg-yellow-600 px-6 py-3.5 h-full flex items-center justify-center text-white dark:text-black transition">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>
            </div>
            <div id="searchSuggestions" class="hidden absolute left-1/2 -translate-x-1/2 mt-2 w-full max-w-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-80 overflow-y-auto p-2 z-50"></div>
        </div>

        <div class="px-1 py-0 mb-2 flex items-center justify-between flex-wrap gap-3">
            <h1 id="streamTitle" class="text-xl sm:text-2xl font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-zinc-900 dark:text-white">Memuat Data Streaming...</h1>
            
            <div id="episodeNavContainer" class="flex items-center gap-2 hidden">
                <button id="prevEpBtn" onclick="changeEpisodeRelative(-1)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Previous
                </button>
                <button id="nextEpBtn" onclick="changeEpisodeRelative(1)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow transition flex items-center gap-1.5">
                    Next <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <div class="bg-black rounded-xl overflow-hidden border border-neon-darkBorder shadow-2xl aspect-video relative flex items-center justify-center" oncontextmenu="return false;">
            <iframe id="videoIframe" src="" class="w-full h-full border-0 select-none" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
        </div>

        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-neon-lightBorder dark:border-neon-darkBorder" onclick="toggleMainServerBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-server text-neon-yellow text-xs"></i>
                    <span class="text-xs text-zinc-900 dark:text-white font-semibold">Pilih Server: <span id="currentServerLabel" class="text-black dark:text-white font-bold">-</span></span>
                </div>
                <i id="mainServerArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300 -rotate-90"></i>
            </div>

            <div id="mainServerContainer" class="space-y-3 pt-1 hidden"></div>
        </div>

        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-neon-lightBorder dark:border-neon-darkBorder" onclick="toggleEpisodeBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list text-neon-yellow text-xs"></i>
                    <span class="text-xs text-zinc-900 dark:text-white font-semibold" id="episodeBoxLabel">Daftar Episode</span>
                </div>
                <i id="episodeBoxArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300"></i>
            </div>

            <div id="episodeBoxContainer" class="flex gap-2 flex-wrap pt-1"></div>
        </div>

        <div class="space-y-4 pt-6 border-t border-neon-lightBorder dark:border-neon-darkBorder">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-zinc-900 dark:text-white">Rekomendasi Anime Serupa</h3>
                <div class="flex gap-1.5">
                    <button onclick="scrollSlider(-1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="scrollSlider(1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            
            <div id="recommendationSlider" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1">
                <p class="text-xs text-zinc-500">Memuat rekomendasi...</p>
            </div>
        </div>

    </main>

    <footer class="border-t border-neon-lightBorder dark:border-neon-darkBorder py-6 mt-12 text-center text-xs text-zinc-700 dark:text-zinc-400">
        <p>NimeDesu - Nonton Anime Sub Indonesia</p>
    </footer>

    <script src="script-stream.js"></script>
</body>
</html>
