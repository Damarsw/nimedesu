<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming - NimeDesu</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#FFFAF0',        
                            lightCard: '#FFF78D',      
                            lightBorder: '#FFF78D',    
                            darkBg: '#0f0e0a',         
                            darkCard: '#1a1912',       
                            darkBorder: '#33311f',     
                            yellow: '#d99b00',         
                            yellowHover: '#b88200'     
                        }
                    },
                    boxShadow: {
                        'glow-yellow': '0 0 15px rgba(217, 155, 0, 0.4), inset 0 0 5px rgba(217, 155, 0, 0.2)'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Inter', sans-serif; -webkit-user-select: none; user-select: none; } 
        .poster-hover-container .play-overlay {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .poster-hover-container:hover .play-overlay {
            opacity: 1;
        }
        .poster-hover-container:hover img {
            transform: scale(1.08);
        }
        /* Menyembunyikan scrollbar namun tetap bisa digeser */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-neon-lightBg text-zinc-900 dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#FFF78D]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-lightBorder dark:border-neon-darkBorder shadow-md dark:shadow-[0_4px_20px_rgba(217,155,0,0.15)] transition-transform duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-1 sm:space-x-2">
                <div class="flex items-center space-x-3 cursor-pointer group ml-1" onclick="window.location.href='index.html'">
                    <span class="text-xl sm:text-2xl font-bold tracking-tight text-zinc-900 dark:text-neon-yellow">NimeDesu</span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <span class="text-xs text-zinc-700 dark:text-zinc-300">Ruang Streaming</span>
            </div>

            <div class="flex items-center space-x-2">
                <button id="btnSearchToggle" onclick="toggleSearchInput(event)" class="p-2.5 rounded-full bg-transparent hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Cari Anime">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>
                <button onclick="toggleTheme()" class="p-2.5 rounded-full bg-transparent hover:bg-yellow-500/20 transition text-zinc-900 dark:text-neon-yellow" title="Ganti Tema">
                    <i id="themeIcon" class="fa-solid fa-moon text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full mt-16 space-y-6">

        <!-- KOTAK PENCARIAN GLOBAL DENGAN LIVE SEARCH -->
        <div id="searchContainer" class="hidden relative mb-8 transition-all duration-300 z-50">
            <div id="searchBoxWrapper" class="relative max-w-xl mx-auto flex items-center bg-white dark:bg-zinc-900 rounded-full border-2 border-neon-yellow shadow-glow-yellow overflow-hidden">
                <input type="text" id="searchField" placeholder="Ketik nama anime disini" oninput="liveSearchAnime()" onkeypress="if(event.key === 'Enter') executeSearch()" class="w-full bg-transparent text-sm pl-6 pr-4 py-3.5 focus:outline-none placeholder:text-zinc-500 font-medium text-zinc-900 dark:text-white">
                <button onclick="executeSearch()" class="bg-neon-yellow dark:bg-neon-yellow hover:bg-yellow-600 px-6 py-3.5 h-full flex items-center justify-center text-white dark:text-black transition">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>
            </div>
            <!-- Dropdown Hasil Poster & Genre Live Search -->
            <div id="searchSuggestions" class="hidden absolute left-1/2 -translate-x-1/2 mt-2 w-full max-w-xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-80 overflow-y-auto p-2 z-50"></div>
        </div>

        <!-- Judul & Tombol Navigasi Sejajar di Kanan -->
        <div class="px-1 py-0 mb-2 flex items-center justify-between flex-wrap gap-3">
            <h1 id="streamTitle" class="text-xl sm:text-2xl font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-zinc-900 dark:text-white">Memuat Data Streaming...</h1>
            
            <!-- Tombol Navigasi Previous & Next Episode -->
            <div id="episodeNavContainer" class="flex items-center gap-2 hidden">
                <button id="prevEpBtn" onclick="changeEpisodeRelative(-1)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Previous
                </button>
                <button id="nextEpBtn" onclick="changeEpisodeRelative(1)" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow transition flex items-center gap-1.5">
                    Next <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- Video Player Container -->
        <div class="bg-black rounded-xl overflow-hidden border border-neon-darkBorder shadow-2xl aspect-video relative flex items-center justify-center">
            <iframe id="videoIframe" src="" class="w-full h-full border-0 select-none" allowfullscreen></iframe>
        </div>

        <!-- Panel Utama Server (Expand) -->
        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-neon-lightBorder dark:border-neon-darkBorder" onclick="toggleMainServerBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-server text-neon-yellow text-xs"></i>
                    <span class="text-xs text-zinc-900 dark:text-white font-semibold">Pilih Server: <span id="currentServerLabel" class="text-black dark:text-white font-bold">-</span></span>
                </div>
                <i id="mainServerArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300 -rotate-90"></i>
            </div>

            <div id="mainServerContainer" class="space-y-3 pt-1 hidden"></div>
        </div>

        <!-- List Episode -->
        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 rounded-xl border border-neon-lightBorder dark:border-neon-darkBorder space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-neon-lightBorder dark:border-neon-darkBorder" onclick="toggleEpisodeBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list text-neon-yellow text-xs"></i>
                    <span class="text-xs text-zinc-900 dark:text-white font-semibold" id="episodeBoxLabel">Daftar Episode</span>
                </div>
                <i id="episodeBoxArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300"></i>
            </div>

            <div id="episodeBoxContainer" class="flex gap-2 flex-wrap pt-1"></div>
        </div>

        <!-- FITUR REKOMENDASI ANIME SLIDER (BISA DIGESER KANAN KIRI) -->
        <div class="space-y-4 pt-6 border-t border-neon-lightBorder dark:border-neon-darkBorder">
            <div class="flex items-center justify-between">
                <h3 class="text-base font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-zinc-900 dark:text-white">Rekomendasi Anime Serupa</h3>
                <div class="flex gap-1.5">
                    <button onclick="scrollSlider(-1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="scrollSlider(1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            
            <!-- Container Slider Geser -->
            <div id="recommendationSlider" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1">
                <p class="text-xs text-zinc-500">Memuat rekomendasi...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-neon-lightBorder dark:border-neon-darkBorder py-6 mt-12 text-center text-xs text-zinc-700 dark:text-zinc-400">
        <p>NimeDesu - Nonton Anime Sub Indonesia</p>
    </footer>

    <!-- SCRIPT STREAMING MANDIRI & REKOMENDASI SLIDER -->
    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        
        const RENDER_API_URL = "https://nimedesu.onrender.com";
        let activeEpisodes = [];
        let activeEpisodeIndex = 0;
        let globalAnimeTitle = "Anime";
        let allAnimeList = [];

        function toggleSearchInput(event) {
            if(event) event.stopPropagation();
            const container = document.getElementById('searchContainer');
            const field = document.getElementById('searchField');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                field.focus();
                if(allAnimeList.length === 0) fetchAllAnimeForSearch();
            } else {
                container.classList.add('hidden');
                document.getElementById('searchSuggestions').classList.add('hidden');
            }
        }

        async function fetchAllAnimeForSearch() {
            try {
                const res = await fetch(`${RENDER_API_URL}/api/anime`);
                allAnimeList = await res.json();
            } catch (e) { console.error(e); }
        }

        function liveSearchAnime() {
            const query = document.getElementById('searchField').value.trim().toLowerCase();
            const suggestionsBox = document.getElementById('searchSuggestions');

            if (!query) {
                suggestionsBox.classList.add('hidden');
                suggestionsBox.innerHTML = '';
                return;
            }

            const matched = allAnimeList.filter(a => (a.title || a.Judul || "").toLowerCase().includes(query)).slice(0, 6);

            if (matched.length === 0) {
                suggestionsBox.innerHTML = `<p class="text-xs text-center text-zinc-500 py-3">Anime tidak ditemukan</p>`;
                suggestionsBox.classList.remove('hidden');
                return;
            }

            suggestionsBox.innerHTML = matched.map(anime => {
                const title = anime.title || anime.Judul || "Tanpa Judul";
                const thumb = anime.image_url || anime.thumbnail || "https://placehold.co/100x150?text=No+Image";
                const animeUrl = anime.url ? anime.url.trim() : "";
                const genres = anime.Genre ? anime.Genre.split(',').map(g => g.trim()).join(', ') : '-';
                
                return `
                    <div onclick="window.location.href='stream.html?url=${encodeURIComponent(animeUrl)}&eps=0'" class="flex items-center gap-3 p-2 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-xl cursor-pointer transition">
                        <img src="${thumb}" class="w-10 h-14 object-cover rounded-lg shrink-0">
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-semibold text-zinc-900 dark:text-white truncate">${title}</h4>
                            <span class="text-[10px] text-zinc-500 dark:text-zinc-400 truncate block">${genres}</span>
                        </div>
                    </div>
                `;
            }).join('');
            suggestionsBox.classList.remove('hidden');
        }

        function executeSearch() {
            const query = document.getElementById('searchField').value.trim();
            if (query) {
                window.location.href = `index.html?q=${encodeURIComponent(query)}`;
            }
        }

        document.addEventListener('click', function(e) {
            const container = document.getElementById('searchContainer');
            const searchBoxWrapper = document.getElementById('searchBoxWrapper');
            const searchSuggestions = document.getElementById('searchSuggestions');
            const btnToggle = document.getElementById('btnSearchToggle');

            if (container && !container.classList.contains('hidden')) {
                if (!searchBoxWrapper.contains(e.target) && !searchSuggestions.contains(e.target) && !btnToggle.contains(e.target)) {
                    container.classList.add('hidden');
                    searchSuggestions.classList.add('hidden');
                }
            }
        });

        async function initStream() {
            const urlParams = new URLSearchParams(window.location.search);
            const animeUrl = urlParams.get('url');
            const targetEps = parseInt(urlParams.get('eps')) || 0; 

            if (!animeUrl) {
                document.getElementById('streamTitle').innerText = "URL Anime Tidak Ditemukan!";
                return;
            }

            try {
                if(allAnimeList.length === 0) {
                    await fetchAllAnimeForSearch();
                }

                const response = await fetch(`${RENDER_API_URL}/api/anime-detail?url=${encodeURIComponent(animeUrl)}`);
                const data = await response.json();

                if (data && data.episodes && data.episodes.length > 0) {
                    activeEpisodes = data.episodes.filter(ep => ep && (ep.episode_title || ep.video_servers));
                    
                    // Urutkan episode secara cerdas (mendukung nomor biasa, OVA, dan Special)
                    activeEpisodes.sort((a, b) => {
                        const titleA = (a.episode_title || "").toLowerCase();
                        const titleB = (b.episode_title || "").toLowerCase();
                        
                        // Menempatkan OVA atau Special di urutan bawah atau sesuai kemunculannya
                        const isOvaSpecialA = titleA.includes('ova') || titleA.includes('special') || titleA.includes('sp');
                        const isOvaSpecialB = titleB.includes('ova') || titleB.includes('special') || titleB.includes('sp');
                        
                        if (isOvaSpecialA && !isOvaSpecialB) return 1;
                        if (!isOvaSpecialA && isOvaSpecialB) return -1;

                        const numA = extractEpisodeNumber(a.episode_title);
                        const numB = extractEpisodeNumber(b.episode_title);
                        return numA - numB;
                    });

                    activeEpisodeIndex = (targetEps >= 0 && targetEps < activeEpisodes.length) ? targetEps : 0;

                    globalAnimeTitle = data.title || data.Judul;
                    if (!globalAnimeTitle) {
                        const segments = animeUrl.split('/').filter(Boolean);
                        globalAnimeTitle = segments[segments.length - 1].replace(/-/g, ' ');
                    }
                    
                    document.getElementById('episodeNavContainer').classList.remove('hidden');
                    renderDynamicEpisodes();

                    const currentAnimeInfo = allAnimeList.find(a => (a.url && a.url.trim() === animeUrl));
                    if (currentAnimeInfo) {
                        renderRecommendations(currentAnimeInfo);
                    }
                } else {
                    document.getElementById('streamTitle').innerText = "Data Episode Tidak Tersedia.";
                }
            } catch (error) {
                console.error("Gagal memuat detail streaming:", error);
                document.getElementById('streamTitle').innerText = "Gagal memuat server streaming.";
            }
        }

        function extractEpisodeNumber(title) {
            if (!title) return 0;
            const match = title.match(/episode\s*(\d+)/i) || title.match(/eps\.?\s*(\d+)/i) || title.match(/(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function scrollSlider(direction) {
            const slider = document.getElementById('recommendationSlider');
            const scrollAmount = 220; 
            slider.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
        }

        function renderRecommendations(currentAnime) {
            const recSlider = document.getElementById('recommendationSlider');
            if (!currentAnime.Genre) {
                recSlider.innerHTML = '<p class="text-xs text-zinc-500">Tidak ada rekomendasi tersedia.</p>';
                return;
            }

            const currentGenres = currentAnime.Genre.split(',').map(g => g.trim().toLowerCase());
            
            const recommendations = allAnimeList.filter(a => {
                const aUrl = a.url ? a.url.trim() : "";
                const currentUrl = currentAnime.url ? currentAnime.url.trim() : "";
                if (aUrl === currentUrl || !a.Genre) return false;

                const aGenres = a.Genre.split(',').map(g => g.trim().toLowerCase());
                return currentGenres.some(g => aGenres.includes(g));
            }).slice(0, 10);

            if (recommendations.length === 0) {
                recSlider.innerHTML = '<p class="text-xs text-zinc-500">Tidak ada anime serupa ditemukan.</p>';
                return;
            }

            recSlider.innerHTML = recommendations.map(rec => {
                const title = rec.title || rec.Judul || "Tanpa Judul";
                const thumb = rec.image_url || rec.thumbnail || "https://placehold.co/300x400?text=No+Image";
                const recUrl = rec.url ? rec.url.trim() : "";
                const status = rec.Status || "Ongoing";

                return `
                    <div class="min-w-[140px] sm:min-w-[160px] w-[140px] sm:w-[160px] group bg-neon-lightCard dark:bg-neon-darkCard rounded-xl overflow-hidden border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow transition-all duration-200 shadow-sm flex flex-col cursor-pointer shrink-0" onclick="window.location.href='stream.html?url=${encodeURIComponent(recUrl)}&eps=0'">
                        <div class="relative aspect-[3/4] overflow-hidden bg-zinc-200 dark:bg-zinc-800 poster-hover-container">
                            <img src="${thumb}" alt="${title}" loading="lazy" class="w-full h-full object-cover transition-transform duration-300">
                            <div class="play-overlay absolute inset-0 bg-black/30 backdrop-blur-[2px] flex items-center justify-center">
                                <div class="w-10 h-10 rounded-full bg-neon-yellow text-black flex items-center justify-center shadow-lg transform scale-90 group-hover:scale-100 transition duration-300">
                                    <i class="fa-solid fa-play text-xs"></i>
                                </div>
                            </div>
                            <span class="absolute top-2 left-2 bg-black/70 backdrop-blur-md text-white dark:text-neon-yellow text-[10px] font-semibold px-2 py-0.5 rounded-full z-10">${status}</span>
                        </div>
                        <div class="p-2.5">
                            <h4 class="font-semibold text-xs line-clamp-2 text-zinc-900 dark:text-white">${title}</h4>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderDynamicEpisodes() {
            const container = document.getElementById('episodeBoxContainer');
            const label = document.getElementById('episodeBoxLabel');

            if(!activeEpisodes || activeEpisodes.length === 0) {
                container.innerHTML = '<p class="text-xs text-zinc-500">Tidak ada episode tersedia.</p>';
                if(label) label.innerText = "Daftar Episode (0)";
                return;
            }

            if(label) label.innerText = `Daftar Episode (${activeEpisodes.length})`;

            const currentEp = activeEpisodes[activeEpisodeIndex];
            const rawEpTitleForHeader = currentEp && currentEp.episode_title ? currentEp.episode_title.replace(/Sub.*$/, '').trim() : `Episode ${activeEpisodeIndex + 1}`;
            document.getElementById('streamTitle').innerText = `Nonton ${globalAnimeTitle} (${rawEpTitleForHeader})`;

            document.getElementById('prevEpBtn').disabled = activeEpisodeIndex <= 0;
            document.getElementById('prevEpBtn').style.opacity = activeEpisodeIndex <= 0 ? '0.5' : '1';
            document.getElementById('nextEpBtn').disabled = activeEpisodeIndex >= activeEpisodes.length - 1;
            document.getElementById('nextEpBtn').style.opacity = activeEpisodeIndex >= activeEpisodes.length - 1 ? '0.5' : '1';

            // Menampilkan tombol daftar episode sesuai string asli (mendukung OVA, Special, dll.)
            container.innerHTML = activeEpisodes.map((ep, index) => {
                const activeClass = index === activeEpisodeIndex ? 'bg-neon-yellow text-white font-bold shadow-glow-yellow' : 'bg-neon-lightBg dark:bg-neon-darkBg text-zinc-900 dark:text-white border border-neon-lightBorder dark:border-neon-darkBorder hover:border-neon-yellow';
                
                let epLabel = ep.episode_title ? ep.episode_title.replace(/Sub.*$/, '').trim() : `Eps ${index + 1}`;
                
                // Mencegah render jika label kosong atau sama persis dengan judul utama
                if (!epLabel || epLabel.toLowerCase() === globalAnimeTitle.toLowerCase()) return '';

                return `<button onclick='selectEpisode(${index})' class="episode-btn ${activeClass} px-3 py-1.5 rounded-lg text-xs font-semibold transition">${epLabel}</button>`;
            }).join('');

            if(activeEpisodes[activeEpisodeIndex] && activeEpisodes[activeEpisodeIndex].video_servers) {
                renderDynamicServers(activeEpisodes[activeEpisodeIndex].video_servers);
            }
        }

        function selectEpisode(index) {
            activeEpisodeIndex = index;
            renderDynamicEpisodes();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function changeEpisodeRelative(direction) {
            const newIndex = activeEpisodeIndex + direction;
            if (newIndex >= 0 && newIndex < activeEpisodes.length) {
                selectEpisode(newIndex);
            }
        }

        function renderDynamicServers(servers) {
            const mainContainer = document.getElementById('mainServerContainer');
            if (!servers || servers.length === 0) {
                mainContainer.innerHTML = '<p class="text-xs text-zinc-500 p-2">Server tidak ditemukan.</p>';
                document.getElementById('currentServerLabel').innerText = "Tidak ada";
                document.getElementById('videoIframe').src = "";
                return;
            }

            const grouped = {};
            servers.forEach(s => {
                const res = s.resolution || "Mirror 360p";
                if(!grouped[res]) grouped[res] = [];
                grouped[res].push(s);
            });

            let htmlContent = '';
            let isFirst = true;

            for(const [resText, srvList] of Object.entries(grouped)) {
                const groupId = 'group' + resText.replace(/[^a-zA-Z0-9]/g, '');
                htmlContent += `
                    <div class="rounded-lg bg-neon-lightBg dark:bg-neon-darkBg border border-neon-lightBorder dark:border-neon-darkBorder overflow-hidden">
                        <div class="flex justify-between items-center px-3 py-2.5 cursor-pointer text-xs font-semibold select-none" onclick="toggleSubserverGroup('${groupId}')">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-video text-neon-yellow text-[10px]"></i> ${resText}</span>
                            <i id="arrow${groupId}" class="fa-solid fa-chevron-down text-[10px] text-zinc-500 transition-transform duration-300"></i>
                        </div>
                        <div id="${groupId}" class="hidden px-3 pb-2.5 pt-1 space-y-1.5 border-t border-neon-lightBorder dark:border-neon-darkBorder">
                `;

                srvList.forEach(srv => {
                    let qualityBadge = "SD";
                    let resLower = srv.resolution.toLowerCase();
                    if (resLower.includes('720')) qualityBadge = "HD";
                    else if (resLower.includes('1080')) qualityBadge = "FHD";

                    htmlContent += `
                        <button onclick="selectServer(this, '${srv.resolution}', '${srv.server}', '${srv.video_url}')" class="server-btn w-full text-left px-3 py-1.5 rounded text-xs bg-neon-lightCard dark:bg-neon-darkCard hover:bg-neon-yellow hover:text-black transition flex justify-between items-center text-zinc-900 dark:text-white">
                            <span>${srv.resolution} (${srv.server})</span>
                            <span class="text-[9px] opacity-75">${qualityBadge}</span>
                        </button>
                    `;

                    if(isFirst) {
                        setTimeout(() => selectServer(null, srv.resolution, srv.server, srv.video_url), 100);
                        isFirst = false;
                    }
                });

                htmlContent += `</div></div>`;
            }
            mainContainer.innerHTML = htmlContent;
        }

        function toggleMainServerBox() {
            const container = document.getElementById('mainServerContainer');
            const arrow = document.getElementById('mainServerArrow');
            if(container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                arrow.style.transform = 'rotate(0deg)';
            } else {
                container.classList.add('hidden');
                arrow.style.transform = 'rotate(-90deg)';
            }
        }

        function toggleSubserverGroup(groupId) {
            const group = document.getElementById(groupId);
            const arrow = document.getElementById('arrow' + groupId);
            if(group.classList.contains('hidden')) {
                group.classList.remove('hidden');
                arrow.style.transform = 'rotate(180deg)';
            } else {
                group.classList.add('hidden');
                arrow.style.transform = 'rotate(0deg)';
            }
        }

        function toggleEpisodeBox() {
            const container = document.getElementById('episodeBoxContainer');
            const arrow = document.getElementById('episodeBoxArrow');
            if(container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                arrow.style.transform = 'rotate(0deg)';
            } else {
                container.classList.add('hidden');
                arrow.style.transform = 'rotate(-90deg)';
            }
        }

        function selectServer(element, resolution, serverNum, videoUrl) {
            document.getElementById('currentServerLabel').innerText = `${resolution} (${serverNum})`;
            document.querySelectorAll('.server-btn').forEach(btn => {
                btn.className = "server-btn w-full text-left px-3 py-1.5 rounded text-xs bg-neon-lightCard dark:bg-neon-darkCard hover:bg-neon-yellow hover:text-black transition flex justify-between items-center text-zinc-900 dark:text-white";
            });
            if(element) {
                element.className = "server-btn w-full text-left px-3 py-1.5 rounded text-xs bg-neon-yellow text-white font-bold shadow-glow-yellow transition flex justify-between items-center";
            }
            document.getElementById('mainServerContainer').classList.add('hidden');
            document.getElementById('mainServerArrow').style.transform = 'rotate(-90deg)';

            const iframe = document.getElementById('videoIframe');
            if (videoUrl) {
                iframe.src = videoUrl;
            }
        }

        function toggleTheme() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                icon.classList.replace('fa-moon', 'fa-sun');
            } else {
                html.classList.add('dark');
                icon.classList.replace('fa-sun', 'fa-moon');
            }
        }

        window.onload = function() {
            initStream();
        };
    </script>
</body>
</html>
