<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Streaming - NimeDesu</title>
    <link rel="icon" href="https://i.ibb.co.com/Ld2r8ZLS/logo.png" type="image/png" />
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        neon: {
                            lightBg: '#F8F9FA',        
                            lightCard: '#FFFFFF',      
                            lightBorder: '#F6BE00',    
                            darkBg: '#0f0e0a',         
                            darkCard: '#1a1912',       
                            darkBorder: '#33311f',     
                            yellow: '#F6BE00',         /* Warna Kuning Cerah Index */
                            yellowHover: '#d4a000'     
                        }
                    },
                    boxShadow: {
                        'glow-yellow': '0 0 15px rgba(246, 190, 0, 0.4), inset 0 0 5px rgba(246, 190, 0, 0.2)'
                    },
                    maxWidth: {
                        '8xl': '90rem'
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style> 
        body { 
            font-family: 'Inter', sans-serif; 
            -webkit-user-select: none; 
            user-select: none; 
        } 
        .poster-hover-container .play-overlay {
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
        }
        .poster-hover-container:hover .play-overlay {
            opacity: 1;
        }
        .poster-hover-container:hover img {
            transform: scale(1.08);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    
        /* Fix Chrome Autofill, Background & Text Color pada Search Input */
        input#searchField {
            background-color: transparent !important;
            color: #000000 !important;
        }
        .dark input#searchField {
            color: #ffffff !important;
        }
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #000000 !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        .dark input:-webkit-autofill,
        .dark input:-webkit-autofill:hover, 
        .dark input:-webkit-autofill:focus, 
        .dark input:-webkit-autofill:active {
            -webkit-background-clip: text;
            -webkit-text-fill-color: #ffffff !important;
            transition: background-color 5000s ease-in-out 0s;
        }
    </style>
</head>
<body class="bg-neon-lightBg text-black dark:bg-neon-darkBg dark:text-white transition-colors duration-300 min-h-screen flex flex-col">

    <!-- FIXED HEADER KONSISTEN DENGAN INDEX -->
    <header id="mainHeader" class="fixed top-0 left-0 right-0 z-50 bg-[#F6BE00]/90 dark:bg-[#14130e]/90 backdrop-blur-md border-b border-neon-yellow/50 dark:border-neon-darkBorder shadow-sm dark:shadow-[0_4px_20px_rgba(217,155,0,0.15)] transition-transform duration-300">
        <div class="w-full px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between max-w-7xl mx-auto">
            <div class="flex items-center space-x-3">
                <div class="flex items-center space-x-3 cursor-pointer group" onclick="window.location.href='index.html'">
                    <span class="text-xl sm:text-2xl font-bold tracking-tight text-black dark:text-neon-yellow">NimeDesu</span>
                </div>
            </div>

            <div class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <span class="text-xs text-zinc-600 dark:text-zinc-300">Butuh bantuan atau kirim masukan? <a href="mailto:damdesu@proton.me" class="text-black dark:text-neon-yellow underline font-medium">Hubungi saya</a></span>
            </div>

            <div class="flex items-center space-x-2">
                <!-- Tombol Search Header -->
                <button id="btnSearchToggle" onclick="toggleSearchInput(event)" class="p-2.5 rounded-full bg-transparent hover:bg-black/10 dark:hover:bg-yellow-500/25 transition text-black dark:text-neon-yellow" title="Cari Anime">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>

                <!-- Tombol User / Login AniList Header -->
                <div id="headerAuthContainer">
                    <button onclick="loginAniList()" class="p-2.5 rounded-full bg-transparent hover:bg-black/10 dark:hover:bg-yellow-500/25 transition text-black dark:text-neon-yellow" title="Login AniList">
                        <i class="fa-solid fa-user text-sm"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- SEARCH BAR OVERLAY KONSISTEN DENGAN INDEX -->
        <div id="searchContainer" class="hidden w-full bg-white/95 dark:bg-[#1a1912]/95 border-b-2 border-neon-yellow shadow-xl py-3 px-4 sm:px-8 transition-all duration-300 relative z-50">
            <div id="searchBoxWrapper" class="relative max-w-2xl mx-auto flex flex-col">
                <div class="flex items-center bg-zinc-100 dark:bg-zinc-900 rounded-2xl border border-neon-yellow/60 overflow-hidden px-2 py-1 shadow-inner">
                    <input type="text" id="searchField" placeholder="Ketik nama anime disini..." oninput="liveSearchAnime()" onkeypress="if(event.key === 'Enter') executeSearch()" class="w-full bg-transparent text-sm sm:text-base pl-4 pr-3 py-2.5 focus:outline-none placeholder:text-zinc-400 font-medium text-black dark:text-white">
                    <button onclick="executeSearch()" class="bg-neon-yellow hover:bg-yellow-600 px-5 py-2.5 rounded-xl flex items-center justify-center text-black font-bold transition shrink-0">
                        <i class="fa-solid fa-magnifying-glass text-xs sm:text-sm"></i>
                    </button>
                    <button onclick="toggleSearchInput(event)" class="p-2.5 text-zinc-400 hover:text-red-500 transition ml-1" title="Tutup">
                        <i class="fa-solid fa-xmark text-base"></i>
                    </button>
                </div>
                <div id="searchSuggestions" class="hidden w-full bg-white dark:bg-[#1a1912] border border-zinc-200 dark:border-zinc-800 rounded-2xl shadow-2xl max-h-72 overflow-y-auto mt-2 p-2 z-50"></div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-8xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full mt-16 space-y-6">

        <!-- KEPALA STREAMING / JUDUL & NAVIGASI -->
        <div class="px-1 py-0 mb-2 flex items-center justify-between flex-wrap gap-3">
            <h1 id="streamTitle" class="text-xl sm:text-2xl font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-black dark:text-white">Memuat Data Streaming...</h1>
            
            <div id="episodeNavContainer" class="flex items-center gap-2 hidden">
                <button id="prevEpBtn" onclick="changeEpisodeRelative(-1)" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-yellow/60 dark:border-neon-darkBorder text-black dark:text-white hover:bg-neon-yellow hover:text-black transition flex items-center gap-1.5 shadow-xs">
                    <i class="fa-solid fa-arrow-left text-[10px]"></i> Previous
                </button>
                <button id="nextEpBtn" onclick="changeEpisodeRelative(1)" class="px-3.5 py-2 rounded-xl text-xs font-bold bg-neon-lightCard dark:bg-neon-darkCard border border-neon-yellow/60 dark:border-neon-darkBorder text-black dark:text-white hover:bg-neon-yellow hover:text-black transition flex items-center gap-1.5 shadow-xs">
                    Next <i class="fa-solid fa-arrow-right text-[10px]"></i>
                </button>
            </div>
        </div>

        <!-- PLAYER IFRAME VIDEO -->
        <div class="bg-black rounded-2xl overflow-hidden border border-neon-yellow/50 dark:border-neon-darkBorder shadow-2xl aspect-video relative flex items-center justify-center" oncontextmenu="return false;">
            <iframe id="videoIframe" src="" class="w-full h-full border-0 select-none" allowfullscreen></iframe>
        </div>

        <!-- PILIHAN SERVER STREAMING -->
        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 sm:p-5 rounded-2xl border border-neon-yellow/50 dark:border-neon-darkBorder shadow-sm space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-zinc-200 dark:border-zinc-800" onclick="toggleMainServerBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-server text-black dark:text-neon-yellow text-xs"></i>
                    <span class="text-xs text-black dark:text-white font-semibold">Pilih Server: <span id="currentServerLabel" class="text-black dark:text-neon-yellow font-bold">-</span></span>
                </div>
                <i id="mainServerArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300 -rotate-90"></i>
            </div>

            <div id="mainServerContainer" class="space-y-2 pt-1 hidden"></div>
        </div>

        <!-- DAFTAR EPISODE -->
        <div class="bg-neon-lightCard dark:bg-neon-darkCard p-4 sm:p-5 rounded-2xl border border-neon-yellow/50 dark:border-neon-darkBorder shadow-sm space-y-3">
            <div class="flex justify-between items-center cursor-pointer select-none pb-2 border-b border-zinc-200 dark:border-zinc-800" onclick="toggleEpisodeBox()">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-list text-black dark:text-neon-yellow text-xs"></i>
                    <span class="text-xs text-black dark:text-white font-semibold" id="episodeBoxLabel">Daftar Episode</span>
                </div>
                <i id="episodeBoxArrow" class="fa-solid fa-chevron-down text-xs text-zinc-500 transition-transform duration-300"></i>
            </div>

            <div id="episodeBoxContainer" class="flex gap-2 flex-wrap pt-1 max-h-60 overflow-y-auto"></div>
        </div>

        <!-- SLIDER REKOMENDASI BERBASIS GENRE -->
        <div class="space-y-4 pt-6 border-t border-zinc-200 dark:border-zinc-800">
            <div class="flex items-center justify-between">
                <h3 class="text-base sm:text-lg font-bold tracking-tight border-l-4 border-neon-yellow pl-3 text-black dark:text-white">Rekomendasi Anime Serupa</h3>
                <div class="flex gap-1.5">
                    <button onclick="scrollSlider(-1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-yellow/60 dark:border-neon-darkBorder hover:bg-neon-yellow hover:text-black flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-left"></i></button>
                    <button onclick="scrollSlider(1)" class="w-8 h-8 rounded-lg bg-neon-lightCard dark:bg-neon-darkCard border border-neon-yellow/60 dark:border-neon-darkBorder hover:bg-neon-yellow hover:text-black flex items-center justify-center text-xs transition"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
            
            <div id="recommendationSlider" class="flex gap-4 overflow-x-auto no-scrollbar scroll-smooth pb-2 pt-1">
                <p class="text-xs text-zinc-500">Memuat rekomendasi...</p>
            </div>
        </div>

    </main>

    <!-- FOOTER KONSISTEN DENGAN INDEX -->
    <footer class="border-t border-neon-yellow dark:border-neon-darkBorder py-6 mt-12 text-center text-xs text-zinc-600 dark:text-zinc-400">
        <p>NimeDesu - Nonton Anime Sub Indonesia</p>
        <p class="mt-1">Butuh bantuan atau kirim masukan? <a href="mailto:damdesu@proton.me" class="text-black dark:text-neon-yellow underline font-medium">Hubungi saya</a></p>
    </footer>

    <!-- FLOATING THEME SWITCHER FLOATING BUTTON -->
    <button onclick="toggleTheme()" 
            class="fixed bottom-10 right-6 z-50 w-12 h-12 rounded-full bg-white dark:bg-zinc-900 text-zinc-900 dark:text-neon-yellow border-2 border-neon-yellow shadow-lg shadow-black/40 flex items-center justify-center hover:scale-110 active:scale-95 transition-all duration-300" 
            title="Ganti Tema">
        <i id="floatingThemeIcon" class="fa-solid fa-sun text-lg"></i>
    </button>

    <script src="script-stream.js"></script>
<div class="cf-turnstile" data-sitekey="0x4AAAAAAEWna6ttG5FYWu12" data-size="invisible" data-callback="onTurnstileSuccess"></div>
</body>
</html>
