name: Run Anime Scraper Bot

on:
  schedule:
    # Jadwal otomatis jam 09:00 pagi & 09:00 malam WIB (UTC 02:00 & 14:00)
    - cron: '0 2,14 * * *'
  
  # Tombol manual untuk tes jalankan bot kapan saja dari tab Actions
  workflow_dispatch:

jobs:
  run-python-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Bot Script
      run: |
        python total.py
