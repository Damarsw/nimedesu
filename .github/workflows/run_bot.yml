name: Run Scraper Worker

on:
  schedule:
    - cron: '0 2,14 * * *'  # Jalan otomatis jam 09:00 WIB dan 21:00 WIB
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 supabase urllib3

    - name: Run Script
      env:
        KETUMBAR: ${{ secrets.KETUMBAR }}
        LADA_HITAM: ${{ secrets.LADA_HITAM }}
        KAYU_MANIS: ${{ secrets.KUNYIT }}
      run: python ongoing.py
