name: Keep All Services Alive

on:
  schedule:
    # Jalan tiap 10 menit sekali
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-all-services:
    runs-on: ubuntu-latest

    steps:
      - name: Process Tree Nodes
        env:
          PING: ${{ secrets.PING }}
          JATI: ${{ secrets.KETUMBAR }}
          MAHONI: ${{ secrets.PUBLIC }}
        run: |
          echo "Checking Node Beringin..."
          curl -s "$PING" || exit 0

          echo "Checking Node Cemara..."
          curl -s "https://nimedesu.vercel.app" || exit 0

          echo "Checking Node Jati..."
          curl -s "$JATI/rest/v1/" \
            -H "apikey: $MAHONI" \
            -H "Authorization: Bearer $MAHONI" || exit 0
