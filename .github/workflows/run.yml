name: Anime Scraper Automation

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper 2 (Anime List & Judul Baru)
        env:
          KETUMBAR: ${{ secrets.KETUMBAR }}
          LADA_HITAM: ${{ secrets.LADA_HITAM }}
          KUNYIT: ${{ secrets.KUNYIT }}
        run: python async_anime_scraper.py
