name: Auto Cleanup and Move Root Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Move and Organize Files
        run: |
          # 1. Pindahkan file Go modul ke core/
          [ -f go.mod ] && mv go.mod core/
          [ -f go.sum ] && mv go.sum core/

          # 2. Pindahkan file SEO/Verifikasi ke web/
          [ -f googleb96f21e07423fffb8.html ] && mv googleb96f21e07423fffb8.html web/
          [ -f sitemap.xml ] && mv sitemap.xml web/

          # 3. Hapus file duplikat & file sisa/sampah di root
          rm -f Dockerfile main.go ongoing.py package.json package-lock.json seo.go

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "refactor: move root assets and clean up legacy files" || exit 0
          git push
