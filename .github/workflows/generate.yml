name: Generate Stealth Project Structure and Code

on:
  workflow_dispatch:

jobs:
  build-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Directories & Generate Backend Files (core)
        run: |
          mkdir -p core/env core/dto core/provider core/guard core/handler web/assets/js web/assets/css

          # 1. core/env/env.go
          cat << 'EOF' > core/env/env.go
          package env

          import (
          	"os"
          	"time"
          )

          var (
          	SupabaseURL          = os.Getenv("SUPABASE_URL")
          	SupabaseKey          = os.Getenv("SUPABASE_KEY")
          	SecretServerKey      = os.Getenv("SECRET_SERVER_KEY")
          	Port                 = getEnvOrDefault("PORT", "10000")
          	TurnstileSecret      = os.Getenv("TURNSTILE_SECRET_KEY")
          	MinCallInterval      = 2000 * time.Millisecond
          	MinJikanCallInterval = 1200 * time.Millisecond
          	CacheTTLAnime        = int64(86400)
          )

          func getEnvOrDefault(key, defaultValue string) string {
          	val := os.Getenv(key)
          	if val == "" {
          		return defaultValue
          	}
          	return val
          }
          EOF

          # 2. core/dto/dto.go
          cat << 'EOF' > core/dto/dto.go
          package dto

          import "sync"

          type TurnstileResponse struct {
          	Success     bool     `json:"success"`
          	ErrorCodes  []string `json:"error-codes"`
          	ChallengeTS string   `json:"challenge_ts"`
          	Hostname    string   `json:"hostname"`
          }

          type BatchStore struct {
          	sync.RWMutex
          	ByPopularity       []RankMedia `json:"bypopularity"`
          	Upcoming           []RankMedia `json:"upcoming"`
          	Favorite           []RankMedia `json:"favorite"`
          	LastUpdated        int64       `json:"last_updated"`
          	SourceByPopularity string      `json:"-"`
          	SourceUpcoming     string      `json:"-"`
          	SourceFavorite     string      `json:"-"`
          }

          type RankMedia struct {
          	ID           int       `json:"id"`
          	Title        RankTitle `json:"title"`
          	CoverImage   RankCover `json:"coverImage"`
          	AverageScore float64   `json:"averageScore"`
          	Popularity   int       `json:"popularity"`
          }

          type RankTitle struct {
          	Romaji        string `json:"romaji"`
          	English       string `json:"english"`
          	UserPreferred string `json:"userPreferred"`
          }

          type RankCover struct {
          	ExtraLarge string `json:"extraLarge"`
          	Large      string `json:"large"`
          }

          type LocalCache struct {
          	sync.RWMutex
          	AnimeList map[string]CacheItem
          	ScoreMap  map[string]string
          	DetailMap map[string]CacheItem
          }

          type CacheItem struct {
          	Timestamp int64
          	Data      interface{}
          }

          type ExternalAnimeMetadata struct {
          	Synopsis    string `json:"synopsis"`
          	Japanese    string `json:"japanese"`
          	Score       string `json:"score"`
          	Status      string `json:"status"`
          	TotalEp     string `json:"total_episodes"`
          	Duration    string `json:"duration"`
          	ReleaseDate string `json:"release_date"`
          	Studio      string `json:"studio"`
          	CoverImg    string `json:"cover_img"`
          }

          type UserSyncRequest struct {
          	AnilistID        string `json:"anilist_id"`
          	SessionID        string `json:"session_id"`
          	CookiesEncrypted string `json:"cookies_encrypted"`
          }

          type LogoutOthersRequest struct {
          	AnilistID        string `json:"anilist_id"`
          	CurrentSessionID string `json:"current_session_id"`
          }
          EOF

          # 3. core/provider/client.go (Pengganti Supabase / kentod.go)
          cat << 'EOF' > core/provider/client.go
          package provider

          import (
          	"bytes"
          	"fmt"
          	"net/http"
          	"nimedesu/core/env"
          	"strings"
          	"time"
          )

          func SupabaseRequest(method, endpoint string, body []byte, headers map[string]string) (*http.Response, error) {
          	reqURL := fmt.Sprintf("%s/rest/v1/%s", strings.TrimRight(env.SupabaseURL, "/"), endpoint)
          	req, err := http.NewRequest(method, reqURL, bytes.NewBuffer(body))
          	if err != nil {
          		return nil, err
          	}

          	req.Header.Set("apikey", env.SupabaseKey)
          	req.Header.Set("Authorization", "Bearer "+env.SupabaseKey)
          	req.Header.Set("Content-Type", "application/json")

          	for k, v := range headers {
          		req.Header.Set(k, v)
          	}

          	client := &http.Client{Timeout: 10 * time.Second}
          	return client.Do(req)
          }
          EOF

          # 4. core/provider/fetcher.go (Batch API Fetcher)
          cat << 'EOF' > core/provider/fetcher.go
          package provider

          import (
          	"bytes"
          	"encoding/json"
          	"fmt"
          	"net/http"
          	"nimedesu/core/dto"
          	"nimedesu/core/env"
          	"sync"
          	"time"
          )

          var (
          	LastAPICallTime      time.Time
          	APICallMutex         sync.Mutex
          	LastJikanCallTime    time.Time
          	JikanCallMutex       sync.Mutex
          	LocalCacheStore      = &dto.LocalCache{
          		AnimeList: make(map[string]dto.CacheItem),
          		ScoreMap:  make(map[string]string),
          		DetailMap: make(map[string]dto.CacheItem),
          	}
          )

          func ThrottleJikanCall() {
          	JikanCallMutex.Lock()
          	elapsed := time.Since(LastJikanCallTime)
          	if elapsed < env.MinJikanCallInterval {
          		time.Sleep(env.MinJikanCallInterval - elapsed)
          	}
          	LastJikanCallTime = time.Now()
          	JikanCallMutex.Unlock()
          }

          func FetchAniListBatch(category string) ([]dto.RankMedia, error) {
          	APICallMutex.Lock()
          	elapsed := time.Since(LastAPICallTime)
          	if elapsed < env.MinCallInterval {
          		time.Sleep(env.MinCallInterval - elapsed)
          	}
          	LastAPICallTime = time.Now()
          	APICallMutex.Unlock()

          	var graphqlQuery string
          	if category == "upcoming" {
          		graphqlQuery = `{
          			Page(page: 1, perPage: 100) {
          				media(type: ANIME, status: NOT_YET_RELEASED, sort: POPULARITY_DESC) {
          					id title { romaji english userPreferred }
          					coverImage { extraLarge large }
          					averageScore popularity
          				}
          			}
          		}`
          	} else if category == "favorite" {
          		graphqlQuery = `{
          			Page(page: 1, perPage: 100) {
          				media(type: ANIME, sort: SCORE_DESC) {
          					id title { romaji english userPreferred }
          					coverImage { extraLarge large }
          					averageScore popularity
          				}
          			}
          		}`
          	} else {
          		graphqlQuery = `{
          			Page(page: 1, perPage: 100) {
          				media(type: ANIME, sort: POPULARITY_DESC) {
          					id title { romaji english userPreferred }
          					coverImage { extraLarge large }
          					averageScore popularity
          				}
          			}
          		}`
          	}

          	reqBody, _ := json.Marshal(map[string]string{"query": graphqlQuery})
          	req, _ := http.NewRequest("POST", "https://graphql.anilist.co", bytes.NewBuffer(reqBody))
          	req.Header.Set("User-Agent", "Mozilla/5.0")
          	req.Header.Set("Content-Type", "application/json")

          	client := &http.Client{Timeout: 8 * time.Second}
          	resp, err := client.Do(req)
          	if err != nil {
          		return nil, fmt.Errorf("anilist request error: %w", err)
          	}
          	defer resp.Body.Close()

          	var result struct {
          		Data struct {
          			Page struct {
          				Media []dto.RankMedia `json:"media"`
          			} `json:"Page"`
          		} `json:"data"`
          	}

          	if err := json.NewDecoder(resp.Body).Decode(&result); err != nil {
          		return nil, fmt.Errorf("anilist decode error: %w", err)
          	}
          	return result.Data.Page.Media, nil
          }

          func FetchJikanBatch(category string) ([]dto.RankMedia, error) {
          	filter := category
          	if filter != "upcoming" && filter != "favorite" {
          		filter = "bypopularity"
          	}

          	client := &http.Client{Timeout: 6 * time.Second}
          	var combined []dto.RankMedia
          	var lastErr error

          	for page := 1; page <= 2; page++ {
          		ThrottleJikanCall()

          		jikanURL := fmt.Sprintf("https://api.jikan.moe/v4/top/anime?filter=%s&page=%d&limit=25", filter, page)
          		req, _ := http.NewRequest("GET", jikanURL, nil)

          		resp, err := client.Do(req)
          		if err != nil {
          			lastErr = fmt.Errorf("jikan request error (page %d): %w", page, err)
          			break
          		}

          		if resp.StatusCode != 200 {
          			lastErr = fmt.Errorf("jikan request failed (page %d): status %d", page, resp.StatusCode)
          			resp.Body.Close()
          			break
          		}

          		var res struct {
          			Data []struct {
          				MalID   int    `json:"mal_id"`
          				Title   string `json:"title"`
          				TitleEn string `json:"title_english"`
          				Images  struct {
          					JPG struct {
          						LargeImageURL string `json:"large_image_url"`
          					} `json:"jpg"`
          				} `json:"images"`
          				Score   float64 `json:"score"`
          				Members int     `json:"members"`
          			} `json:"data"`
          		}

          		decodeErr := json.NewDecoder(resp.Body).Decode(&res)
          		resp.Body.Close()
          		if decodeErr != nil {
          			lastErr = fmt.Errorf("jikan decode error: %w", decodeErr)
          			break
          		}

          		for _, item := range res.Data {
          			english := item.TitleEn
          			if english == "" {
          				english = item.Title
          			}
          			combined = append(combined, dto.RankMedia{
          				ID: item.MalID,
          				Title: dto.RankTitle{
          					Romaji:        item.Title,
          					English:       english,
          					UserPreferred: english,
          				},
          				CoverImage: dto.RankCover{
          					ExtraLarge: item.Images.JPG.LargeImageURL,
          					Large:      item.Images.JPG.LargeImageURL,
          				},
          				AverageScore: item.Score * 10,
          				Popularity:   item.Members,
          			})
          		}
          	}

          	if len(combined) == 0 {
          		return nil, lastErr
          	}
          	return combined, nil
          }
          EOF

          # 5. core/guard/guard.go
          cat << 'EOF' > core/guard/guard.go
          package guard

          import (
          	"crypto/sha256"
          	"crypto/subtle"
          	"encoding/hex"
          	"fmt"
          	"math"
          	"net/http"
          	"nimedesu/core/env"
          	"strconv"
          	"strings"
          	"time"

          	"github.com/gin-gonic/gin"
          )

          func SecurityMiddleware() gin.HandlerFunc {
          	return func(c *gin.Context) {
          		path := c.Request.URL.Path

          		if path == "/" || path == "/health" || strings.HasPrefix(path, "/api/proxy-stream") {
          			c.Next()
          			return
          		}

          		if strings.HasPrefix(path, "/api/") {
          			clientTimeStr := c.GetHeader("X-Client-Time")
          			clientToken := c.GetHeader("X-Client-Token")

          			if clientTimeStr == "" || clientToken == "" {
          				c.AbortWithStatusJSON(http.StatusForbidden, gin.H{"error": "Access Denied: Missing Security Headers"})
          				return
          			}

          			reqTime, err := strconv.ParseInt(clientTimeStr, 10, 64)
          			if err != nil || math.Abs(float64(time.Now().Unix()-reqTime)) > 30 {
          				c.AbortWithStatusJSON(http.StatusForbidden, gin.H{"error": "Access Denied: Token Expired"})
          				return
          			}

          			expectedPayload := fmt.Sprintf("%d_%s", reqTime, env.SecretServerKey)
          			hash := sha256.Sum256([]byte(expectedPayload))
          			expectedToken := hex.EncodeToString(hash[:])

          			if subtle.ConstantTimeCompare([]byte(expectedToken), []byte(clientToken)) != 1 {
          				c.AbortWithStatusJSON(http.StatusForbidden, gin.H{"error": "Access Denied: Invalid Signature"})
          				return
          			}
          		}
          		c.Next()
          	}
          }
          EOF

          # 6. core/handler/resource.go
          cat << 'EOF' > core/handler/resource.go
          package handler

          import (
          	"encoding/json"
          	"fmt"
          	"net/http"
          	"net/url"
          	"nimedesu/core/provider"
          	"strconv"

          	"github.com/gin-gonic/gin"
          )

          func AnimeListHandler(c *gin.Context) {
          	page, _ := strconv.Atoi(c.DefaultQuery("page", "1"))
          	perPage, _ := strconv.Atoi(c.DefaultQuery("per_page", "12"))
          	searchQuery := c.Query("q")

          	offset := (page - 1) * perPage
          	query := fmt.Sprintf("select=id,title,url,status,genre,img_url&order=id.asc&offset=%d&limit=%d", offset, perPage)
          	if searchQuery != "" {
          		query += fmt.Sprintf("&title=ilike.*%s*", url.QueryEscape(searchQuery))
          	}

          	resp, err := provider.SupabaseRequest("GET", "anime?"+query, nil, map[string]string{
          		"Prefer": "count=exact",
          	})
          	if err != nil {
          		c.JSON(http.StatusOK, gin.H{"data": []interface{}{}, "total_pages": 1})
          		return
          	}
          	defer resp.Body.Close()

          	var data []map[string]interface{}
          	json.NewDecoder(resp.Body).Decode(&data)

          	c.JSON(http.StatusOK, gin.H{
          		"data":        data,
          		"page":        page,
          		"total_pages": 10,
          	})
          }
          EOF

          # 7. core/handler/metric.go
          cat << 'EOF' > core/handler/metric.go
          package handler

          import (
          	"math"
          	"net/http"
          	"nimedesu/core/dto"
          	"nimedesu/core/provider"
          	"strconv"

          	"github.com/gin-gonic/gin"
          )

          var BatchStoreInstance = &dto.BatchStore{}

          func RankingHandler(c *gin.Context) {
          	category := c.DefaultQuery("type", "bypopularity")
          	page, _ := strconv.Atoi(c.DefaultQuery("page", "1"))

          	BatchStoreInstance.RLock()
          	var allMedia []dto.RankMedia
          	switch category {
          	case "upcoming":
          		allMedia = BatchStoreInstance.Upcoming
          	case "favorite":
          		allMedia = BatchStoreInstance.Favorite
          	default:
          		allMedia = BatchStoreInstance.ByPopularity
          	}
          	BatchStoreInstance.RUnlock()

          	if len(allMedia) == 0 {
          		fetched, _ := provider.FetchAniListBatch(category)
          		allMedia = fetched
          	}

          	top3 := make([]dto.RankMedia, 0)
          	if len(allMedia) >= 3 {
          		top3 = allMedia[:3]
          	} else {
          		top3 = allMedia
          	}

          	var pageMedia []dto.RankMedia
          	startIdx := 3
          	if page > 1 {
          		startIdx = (page-1)*12 + 3
          	}

          	if startIdx < len(allMedia) {
          		endIdx := startIdx + 12
          		if endIdx > len(allMedia) {
          			endIdx = len(allMedia)
          		}
          		pageMedia = allMedia[startIdx:endIdx]
          	} else {
          		pageMedia = []dto.RankMedia{}
          	}

          	totalItems := len(allMedia) - 3
          	if totalItems < 1 {
          		totalItems = 1
          	}
          	lastPage := int(math.Ceil(float64(totalItems) / 12.0))

          	c.JSON(http.StatusOK, gin.H{
          		"top3":      top3,
          		"list":      pageMedia,
          		"last_page": lastPage,
          	})
          }
          EOF

          # 8. core/handler/session.go
          cat << 'EOF' > core/handler/session.go
          package handler

          import (
          	"encoding/json"
          	"fmt"
          	"net/http"
          	"net/url"
          	"nimedesu/core/dto"
          	"nimedesu/core/provider"

          	"github.com/gin-gonic/gin"
          )

          func UserSyncHandler(c *gin.Context) {
          	var body dto.UserSyncRequest
          	if err := c.BindJSON(&body); err != nil {
          		c.JSON(http.StatusBadRequest, gin.H{"error": err.Error()})
          		return
          	}

          	resp, err := provider.SupabaseRequest("GET", fmt.Sprintf("login?anilist_id=eq.%s", url.QueryEscape(body.AnilistID)), nil, nil)
          	if err != nil {
          		c.JSON(http.StatusInternalServerError, gin.H{"error": err.Error()})
          		return
          	}
          	defer resp.Body.Close()

          	c.JSON(http.StatusOK, gin.H{"status": "success"})
          }
          EOF

          # 9. core/main.go
          cat << 'EOF' > core/main.go
          package main

          import (
          	"log"
          	"nimedesu/core/env"
          	"nimedesu/core/guard"
          	"nimedesu/core/handler"

          	"github.com/gin-contrib/cors"
          	"github.com/gin-gonic/gin"
          )

          func main() {
          	if env.SupabaseURL == "" || env.SupabaseKey == "" {
          		log.Fatal("FATAL: SUPABASE_URL & SUPABASE_KEY must be set!")
          	}

          	gin.SetMode(gin.ReleaseMode)
          	r := gin.New()
          	r.Use(gin.Recovery())

          	r.Use(cors.New(cors.Config{
          		AllowOrigins:     []string{"https://nimedesu.vercel.app"},
          		AllowMethods:     []string{"GET", "POST", "OPTIONS"},
          		AllowHeaders:     []string{"Origin", "Content-Type", "X-Client-Token", "X-Client-Time", "X-Turnstile-Token"},
          		AllowCredentials: true,
          	}))

          	r.Use(guard.SecurityMiddleware())

          	r.GET("/api/anime", handler.AnimeListHandler)
          	r.GET("/api/ranking", handler.RankingHandler)
          	r.POST("/api/user-sync", handler.UserSyncHandler)

          	log.Printf("Server running on port %s", env.Port)
          	r.Run(":" + env.Port)
          }
          EOF

          # 10. core/Dockerfile
          cat << 'EOF' > core/Dockerfile
          FROM golang:1.22-alpine AS builder
          WORKDIR /app
          COPY go.mod go.sum ./
          RUN go mod download
          COPY . .
          RUN CGO_ENABLED=0 GOOS=linux go build -o main ./main.go

          FROM alpine:latest
          WORKDIR /root/
          COPY --from=builder /app/main .
          EXPOSE 10000
          CMD ["./main"]
          EOF

          # 11. Relocate Frontend Files to web/
          [ -f index.html ] && mv index.html web/
          [ -f stream.html ] && mv stream.html web/
          [ -f script-index.js ] && mv script-index.js web/assets/js/app.js
          [ -f script-stream.js ] && mv script-stream.js web/assets/js/player.js
          [ -f obfuscate.js ] && mv obfuscate.js web/

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: auto-generate stealth architecture files and folders" || exit 0
          git push
