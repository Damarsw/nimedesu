name: Restore Ongoing Scraper Script

on:
  workflow_dispatch:

jobs:
  restore-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create scripts directory and ongoing.py
        run: |
          mkdir -p scripts
          cat << 'EOF' > scripts/ongoing.py
          import os
          import json
          import requests

          print("[INFO] Ongoing Anime Scraper Script Restored.")
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/ongoing.py
          git commit -m "chore: restore ongoing.py scraper in scripts directory" || exit 0
          git push
