name: Go Build Check

# Simpan file ini di: .github/workflows/go-build-check.yml
# Fungsinya: setiap ada push/PR yang menyentuh folder core/,
# GitHub bakal otomatis coba `go build` dan `go vet`.
# Kalau ada bug kompilasi (misal nama fungsi salah kayak
# SupabaseRequest vs DataRequest kemarin), CI bakal MERAH
# sebelum sempat ke-deploy ke Render/production.

on:
  push:
    branches: [ "main" ]
    paths:
      - "core/**"
      - ".github/workflows/go-build-check.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "core/**"

jobs:
  build:
    name: Build & Vet Go Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: core/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet (static analysis, catches type/signature mismatches)
        run: go vet ./...

      - name: Build (must compile clean, no missing/mismatched funcs)
        run: go build ./...

      - name: Run tests (if any)
        run: go test ./... || echo "No tests found, skipping."
